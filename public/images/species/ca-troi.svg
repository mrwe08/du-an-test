<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a3a"/>
      <stop offset="100%" stop-color="#1a4a6a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9eae"/>
      <stop offset="50%" stop-color="#b0c4d4"/>
      <stop offset="100%" stop-color="#d0daea"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%">
