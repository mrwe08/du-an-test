<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="50%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="40%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="220" rx="16" fill="url(#bg)"/>
  <!-- Water caustics -->
  <g opacity="0.06" fill="none" stroke="#fff" stroke-width="0.5">
    <path d="M0,30 Q50,20 100,35 Q150,50 200,30 Q250,10 300,35 Q350,55 400,30"/>
    <path d="M0,170 Q40,160 80,175 Q130,185 180,170 Q230,155 280,172 Q340,185 400,170"/>
  </g>
  <!-- Bubbles -->
  <circle cx="42" cy="32" r="3" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="355" cy="40" r="2" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <circle cx="50" cy="175" r="2.5" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <!-- Fish body shadow -->
  <ellipse cx="195" cy="114" rx="148" ry="38" fill="#000" opacity="0.12"/>
  <!-- Dorsal fin -->
  <path d="M95,72 L105,58 L130,55 L160,53 L190,52 L220,53 L250,55 L280,58 L300,65 L310,72" fill="#3e2723" stroke="#795548" stroke-width="0.7" opacity="0.85"/>
  <!-- Main body -->
  <ellipse cx="192" cy="106" rx="148" ry="38" fill="url(#body)" stroke="#795548" stroke-width="0.5"/>
  
  
  <!-- Lateral line -->
  <path d="M72,104 C142,98 252,100 312,106" fill="none" stroke="#795548" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,2"/>
  <!-- Tail / Caudal fin -->
  <path d="M328,82 L352,65 L358,80 L354,106 L358,132 L352,148 L328,128" fill="#3e2723" stroke="#795548" stroke-width="0.7"/>
  
  <!-- Anal fin -->
  <path d="M180,138 L195,160 L215,158 L230,155 L250,158 L270,155 L290,158 L305,152 L315,140" fill="#3e2723" stroke="#795548" stroke-width="0.6" opacity="0.8"/>
  <!-- Pelvic fin -->
  <path d="M162,146 L172,168 L189,162 L185,144" fill="#3e2723" stroke="#795548" stroke-width="0.5" opacity="0.75"/>
  <!-- Pectoral fin -->
  <path d="M97,114 L77,138 L94,144 L107,128" fill="#3e2723" stroke="#795548" stroke-width="0.5" opacity="0.75"/>
  <!-- Gill cover -->
  <path d="M93,84 Q99,106 93,128" fill="none" stroke="#795548" stroke-width="1.1" opacity="0.4"/>
  <!-- Barbels (if any) -->
  <line x1="55" y1="98" x2="20" y2="82" stroke="#795548" stroke-width="1.3" opacity="0.7"/><line x1="55" y1="100" x2="22" y2="90" stroke="#795548" stroke-width="1.1" opacity="0.6"/><line x1="55" y1="104" x2="24" y2="98" stroke="#795548" stroke-width="0.9" opacity="0.5"/><line x1="55" y1="108" x2="26" y2="108" stroke="#795548" stroke-width="0.8" opacity="0.5"/><line x1="55" y1="110" x2="24" y2="116" stroke="#795548" stroke-width="0.9" opacity="0.5"/><line x1="55" y1="112" x2="22" y2="124" stroke="#795548" stroke-width="1.1" opacity="0.6"/><line x1="55" y1="114" x2="20" y2="130" stroke="#795548" stroke-width="1.3" opacity="0.7"/><line x1="55" y1="116" x2="22" y2="138" stroke="#795548" stroke-width="1" opacity="0.5"/>
  <!-- Head contour -->
  <path d="M65,94 Q52,106 65,118" fill="none" stroke="#795548" stroke-width="1"/>
  <!-- Mouth -->
  <path d="M63,104 Q55,106 63,110" fill="none" stroke="#795548" stroke-width="1.1"/>
  <!-- Eye -->
  <circle cx="79" cy="96" r="8.5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="77" cy="94" r="2.8" fill="#111"/>
  <circle cx="76" cy="93" r="1.1" fill="rgba(255,255,255,0.75)"/>
  <!-- Species Label -->
  <rect x="50" y="194" width="300" height="20" rx="10" fill="rgba(0,0,0,0.5)"/>
  <text x="200" y="208" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">CÁ TRÊ • Clarias batrachus</text>
</svg>