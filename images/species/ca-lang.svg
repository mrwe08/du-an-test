<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a0e"/>
      <stop offset="100%" stop-color="#3d3520"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4a2a"/>
      <stop offset="50%" stop-color="#6b5b3a"/>
      <stop offset="100%" stop-color="#8b7355"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="40%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="220" rx="16" fill="url(#bg)"/>
  <!-- Water caustics -->
  <g opacity="0.06" fill="none" stroke="#fff" stroke-width="0.5">
    <path d="M0,30 Q50,20 100,35 Q150,50 200,30 Q250,10 300,35 Q350,55 400,30"/>
    <path d="M0,170 Q40,160 80,175 Q130,185 180,170 Q230,155 280,172 Q340,185 400,170"/>
  </g>
  <!-- Bubbles -->
  <circle cx="42" cy="32" r="3" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="355" cy="40" r="2" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <circle cx="50" cy="175" r="2.5" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <!-- Fish body shadow -->
  <ellipse cx="195" cy="116" rx="138" ry="44" fill="#000" opacity="0.12"/>
  <!-- Dorsal fin -->
  <path d="M145,68 L158,42 L175,46 L185,55 L192,68" fill="#4a3a1a" stroke="#8b6914" stroke-width="0.7" opacity="0.85"/>
  <!-- Main body -->
  <ellipse cx="192" cy="108" rx="138" ry="44" fill="url(#body)" stroke="#8b6914" stroke-width="0.5"/>
  
  
  <!-- Lateral line -->
  <path d="M72,106 C142,100 252,102 312,108" fill="none" stroke="#8b6914" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,2"/>
  <!-- Tail / Caudal fin -->
  <path d="M318,82 L355,55 L362,78 L355,108 L362,138 L355,158 L318,130" fill="#cd6600" stroke="#8b6914" stroke-width="0.7"/>
  
  <!-- Anal fin -->
  <path d="M228,152 L245,170 L265,168 L278,155" fill="#4a3a1a" stroke="#8b6914" stroke-width="0.6" opacity="0.8"/>
  <!-- Pelvic fin -->
  <path d="M162,148 L172,170 L189,164 L185,146" fill="#4a3a1a" stroke="#8b6914" stroke-width="0.5" opacity="0.75"/>
  <!-- Pectoral fin -->
  <path d="M97,116 L77,140 L94,146 L107,130" fill="#4a3a1a" stroke="#8b6914" stroke-width="0.5" opacity="0.75"/>
  <!-- Gill cover -->
  <path d="M93,86 Q99,108 93,130" fill="none" stroke="#8b6914" stroke-width="1.1" opacity="0.4"/>
  <!-- Barbels (if any) -->
  <line x1="60" y1="104" x2="22" y2="90" stroke="#8b6914" stroke-width="1.5" opacity="0.7"/><line x1="60" y1="106" x2="25" y2="100" stroke="#8b6914" stroke-width="1.2" opacity="0.6"/><line x1="60" y1="110" x2="28" y2="118" stroke="#8b6914" stroke-width="1" opacity="0.5"/><line x1="60" y1="112" x2="30" y2="128" stroke="#8b6914" stroke-width="0.8" opacity="0.4"/>
  <!-- Head contour -->
  <path d="M65,96 Q52,108 65,120" fill="none" stroke="#8b6914" stroke-width="1"/>
  <!-- Mouth -->
  <path d="M63,106 Q55,108 63,112" fill="none" stroke="#8b6914" stroke-width="1.1"/>
  <!-- Eye -->
  <circle cx="79" cy="98" r="8.5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="77" cy="96" r="2.8" fill="#111"/>
  <circle cx="76" cy="95" r="1.1" fill="rgba(255,255,255,0.75)"/>
  <!-- Species Label -->
  <rect x="50" y="194" width="300" height="20" rx="10" fill="rgba(0,0,0,0.5)"/>
  <text x="200" y="208" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.4">CÁ LĂNG • Hemibagrus wyckioides</text>
</svg>